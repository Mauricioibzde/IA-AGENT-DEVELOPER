[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-agent-developer"
version = "0.3.0"
description = "Autonomous local Ollama coding agent with sandboxed tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mauricioibzde" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ia-agent = "local_agent.cli:main"
ollama-agent = "ollama_agent:main"

[tool.setuptools]
py-modules = ["ollama_agent", "verify_agent"]

[tool.setuptools.packages.find]
include = ["local_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "local_agent/tests"]
pythonpath = ["."]
